<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiangmaatla | Communication Officer</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<style>
:root{--green:#007749;--navy:#00194A;--gold:#FFB612;--red:#E03C31}body{margin:0;background:#f5f7fa;color:#18212b;font-family:Arial,sans-serif}.sidebar{position:fixed;left:0;top:0;bottom:0;width:250px;background:var(--navy);color:#fff;padding:22px 16px}.brand{font-size:20px;font-weight:700;padding:0 10px 25px}.brand small{display:block;font-size:12px;opacity:.7;margin-top:4px}.nav-btn{width:100%;border:0;background:transparent;color:#fff;text-align:left;padding:12px 14px;border-radius:9px;margin-bottom:6px;font-size:14px}.nav-btn.active,.nav-btn:hover{background:var(--green)}.main{margin-left:250px;padding:28px;max-width:1500px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.topbar h1{font-size:28px;margin:0}.user-area{display:flex;gap:10px;align-items:center}.card{border:0;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.06)}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.section-head h2{font-size:22px;margin:0}.table-wrap{overflow:auto}.table{margin-bottom:0}.table th{white-space:nowrap}.actions{white-space:nowrap}.btn-primary{background:var(--green);border-color:var(--green)}.btn-primary:hover{background:#00633d;border-color:#00633d}.badge-open{background:#d8f3e7;color:#087443}.badge-closed{background:#f8d7da;color:#842029}.empty{padding:40px;text-align:center;color:#777}.alert{border-radius:9px}.mobile-menu{display:none}@media(max-width:900px){.sidebar{transform:translateX(-100%);transition:.2s;z-index:1050}.sidebar.open{transform:translateX(0)}.main{margin-left:0;padding:18px}.mobile-menu{display:inline-block}.topbar h1{font-size:22px}.user-area span{display:none}}
.dashboard-shell{display:none}.dashboard-shell.ready{display:block}.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#f5f7fa}.login-card{width:100%;max-width:430px;background:#fff;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.10);padding:32px}.login-brand{text-align:center;margin-bottom:26px}.login-brand .icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--navy);color:var(--gold);font-size:27px;margin:0 auto 14px}.login-brand h1{font-size:24px;margin:0 0 5px}.login-brand p{margin:0;color:#6c757d;font-size:14px}.login-error{display:none}.login-error.show{display:block}</style>
</head>
<body>
<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-brand">
      <div class="icon"><i class="fa-solid fa-newspaper"></i></div>
      <h1>Communication Officer Login</h1>
      <p>Tiangmaatla Multipurpose Centre</p>
    </div>
    <div class="alert alert-danger login-error" id="loginError"></div>
    <form id="loginForm">
      <div class="mb-3"><label class="form-label" for="loginEmail">Email address</label><input class="form-control" id="loginEmail" type="email" autocomplete="username" required></div>
      <div class="mb-3"><label class="form-label" for="loginPassword">Password</label><input class="form-control" id="loginPassword" type="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary w-100" id="loginBtn" type="submit"><i class="fa-solid fa-right-to-bracket me-1"></i> Sign in</button>
    </form>
  </div>
</div>
<div class="dashboard-shell" id="dashboardShell">
<aside class="sidebar" id="sidebar">
<div class="brand">Tiangmaatla<small>Communication Officer</small></div>
<button class="nav-btn active" data-section="news"><i class="fa-solid fa-newspaper"></i> News & Updates</button>
<button class="nav-btn mt-4" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Sign out</button>
</aside>
<main class="main">
<div class="topbar"><div><button class="btn btn-outline-secondary mobile-menu me-2" id="mobileMenuBtn"><i class="fa-solid fa-bars"></i></button><h1 class="d-inline">News & Updates</h1></div><div class="user-area"><span id="adminEmail"></span></div></div>
<div id="message"></div>
<section id="news" class="section active">
<div class="section-head"><h2>News & Updates</h2><button class="btn btn-primary" id="addNewsBtn"><i class="fa-solid fa-plus"></i> Add post</button></div>
<div class="card p-3"><div class="table-wrap"><table class="table align-middle"><thead><tr><th>Title</th><th>Category</th><th>Date</th><th>Published</th><th>Image filename</th><th>Actions</th></tr></thead><tbody id="newsTable"></tbody></table></div></div>
</section>
</main>
<div class="modal fade" id="newsModal" tabindex="-1"><div class="modal-dialog modal-lg"><div class="modal-content"><form id="newsForm"><div class="modal-header" style="background:var(--navy);color:#fff"><h5 class="modal-title" id="newsModalTitle">Add news post</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="hidden" id="newsId"><div class="row g-3"><div class="col-md-8"><label class="form-label">Title</label><input class="form-control" id="newsTitle" required></div><div class="col-md-4"><label class="form-label">Category</label><input class="form-control" id="newsCategory" value="Announcements" required></div><div class="col-12"><label class="form-label">Excerpt</label><textarea class="form-control" id="newsExcerpt" rows="2"></textarea></div><div class="col-12"><label class="form-label">Content</label><textarea class="form-control" id="newsContent" rows="6" required></textarea></div><div class="col-md-6"><label class="form-label">Image filename</label><input class="form-control" id="newsImage" placeholder="example.jpg"><div class="form-text">Developer uploads this file to /assets/images/posts/</div></div><div class="col-md-3"><label class="form-label">Badge</label><input class="form-control" id="newsBadge"></div><div class="col-md-3"><label class="form-label">Badge text</label><input class="form-control" id="newsBadgeText"></div><div class="col-md-4"><label class="form-label">Published date</label><input type="date" class="form-control" id="newsDate"></div><div class="col-md-4 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" id="newsPublished" checked><label class="form-check-label" for="newsPublished">Published</label></div></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary">Save post</button></div></form></div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="tmc-communications.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
